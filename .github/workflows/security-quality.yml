name: Security and Quality

on:
  push:
    branches: ["main", "feature/**", "security/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP syntax and static security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Detect tracked environment and private-key files
        shell: bash
        run: |
          set -euo pipefail
          tracked_sensitive_files="$(git ls-files | grep -E '(^|/)\\.env($|\\.)|(^|/)id_rsa$|\\.(pem|p12|pfx)$' | grep -vE '(^|/)\\.env\\.example$' || true)"
          if [ -n "$tracked_sensitive_files" ]; then
            echo "$tracked_sensitive_files"
            echo "::error::Potential environment secret or private key tracked in git."
            exit 1
          fi

      - name: Composer dependency audit (when root manifest exists)
        shell: bash
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish
            composer audit --no-interaction
          else
            echo "No root composer.json; root dependency audit is not configured."
          fi

  codeql:
    name: CodeQL PHP analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      - name: Analyze PHP code
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:php"
